<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#073b63">
  <title>Campanhas — OuvEdu de Bolso</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#eaf2f8,#fff);color:#173b5e;min-height:100vh}
    header{padding:22px 16px;text-align:center;background:#073b63;color:#fff}
    header h1{margin:0 0 7px;font-size:26px}
    header p{margin:0;font-size:13px;opacity:.9}
    main{max-width:850px;margin:22px auto;padding:0 15px 35px}
    .voltar{display:inline-block;margin-bottom:16px;padding:10px 15px;border-radius:10px;background:#073b83;color:white;text-decoration:none;font-weight:bold;font-size:14px}
    .intro{margin:0 0 18px;line-height:1.6;text-align:center;color:#52677b}
    .lista{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}
    .campanha{border:1px solid #dce7ef;border-left:5px solid #2196a6;border-radius:14px;padding:18px;background:#fff;text-align:left;box-shadow:0 4px 14px #0000000c;cursor:pointer;color:#173b5e}
    .campanha strong{display:block;font-size:17px;margin-bottom:7px}
    .campanha span{font-size:13px;color:#607487}
    .campanha:hover{border-color:#2196a6;transform:translateY(-1px)}
    .visualizador{display:none;background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 18px #00000012}
    .visualizador.ativo{display:block}
    .topo-campanha{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
    .topo-campanha h2{font-size:19px;margin:0;color:#073b83}
    .contador{font-size:13px;color:#52677b;white-space:nowrap}
    .imagem-wrap{background:#102b45;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:180px}
    .imagem-wrap img{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain}
    .navegacao{display:flex;gap:10px;margin-top:14px}
    button{border:0;border-radius:10px;padding:13px 16px;font-weight:bold;font-size:14px;cursor:pointer}
    .nav{flex:1;background:#073b83;color:white}
    .nav:disabled{opacity:.35;cursor:not-allowed}
    .menu{background:#e8f1f8;color:#173b5e}
    .barra{height:6px;background:#e7edf3;border-radius:10px;overflow:hidden;margin:12px 0}
    .progresso{height:100%;background:linear-gradient(90deg,#2196a6,#087fc1);width:0}
    footer{text-align:center;padding:18px;color:#718293;font-size:12px}
    @media(max-width:520px){header h1{font-size:22px}.visualizador{padding:9px}.topo-campanha{align-items:flex-start;flex-direction:column}.imagem-wrap img{max-height:66vh}.navegacao{flex-wrap:wrap}.navegacao button{padding:12px 10px}}
  </style>
</head>
<body>
  <header>
    <h1>Campanhas</h1>
    <p>OuvEdu de Bolso — Ouvidoria Setorial | SEDUC-MT</p>
  </header>
  <main>
    <a class="voltar" href="../index.html">← Voltar ao início</a>
    <p class="intro" id="instrucao">Escolha uma campanha para visualizar as imagens na ordem de apresentação.</p>
    <section class="lista" id="listaCampanhas" aria-label="Campanhas disponíveis"></section>
    <section class="visualizador" id="visualizador" aria-live="polite">
      <div class="topo-campanha">
        <h2 id="tituloCampanha"></h2>
        <span class="contador" id="contador"></span>
      </div>
      <div class="barra"><div class="progresso" id="progresso"></div></div>
      <div class="imagem-wrap"><img id="imagemCampanha" alt=""></div>
      <div class="navegacao">
        <button class="nav" id="anterior" type="button">← Anterior</button>
        <button class="menu" id="voltarLista" type="button">Campanhas</button>
        <button class="nav" id="proxima" type="button">Próxima →</button>
      </div>
    </section>
  </main>
  <footer>OuvEdu de Bolso — SEDUC-MT | Ouvidoria Setorial</footer>

<script>
let dados;
let campanhaAtual=null;
let indice=0;
const lista=document.getElementById('listaCampanhas');
const visualizador=document.getElementById('visualizador');
const instrucao=document.getElementById('instrucao');
const titulo=document.getElementById('tituloCampanha');
const imagem=document.getElementById('imagemCampanha');
const contador=document.getElementById('contador');
const progresso=document.getElementById('progresso');
const anterior=document.getElementById('anterior');
const proxima=document.getElementById('proxima');

function abrirCampanha(c){
  campanhaAtual=c; indice=0;
  lista.style.display='none'; instrucao.style.display='none';
  visualizador.classList.add('ativo');
  renderizar();
}
function renderizar(){
  const item=campanhaAtual.imagens[indice];
  titulo.textContent=campanhaAtual.titulo;
  imagem.src=item.arquivo;
  imagem.alt=campanhaAtual.titulo+' — imagem '+item.ordem;
  contador.textContent='Imagem '+item.ordem+' de '+campanhaAtual.total_imagens;
  progresso.style.width=((indice+1)/campanhaAtual.total_imagens*100)+'%';
  anterior.disabled=indice===0;
  proxima.disabled=indice===campanhaAtual.imagens.length-1;
}
function voltarLista(){
  visualizador.classList.remove('ativo');
  lista.style.display='grid'; instrucao.style.display='block';
  campanhaAtual=null;
}
document.getElementById('voltarLista').addEventListener('click',voltarLista);
anterior.addEventListener('click',()=>{if(indice>0){indice--;renderizar();}});
proxima.addEventListener('click',()=>{if(indice<campanhaAtual.imagens.length-1){indice++;renderizar();}});
// Os dados também ficam incorporados nesta página para permitir abertura
// direta do index.html (file://), sem depender de fetch ou servidor.
try {
  const json = JSON.parse(document.getElementById('dadosCampanhas').textContent);
  dados = json;
  json.campanhas.forEach(c => {
    const botao = document.createElement('button');
    botao.type = 'button';
    botao.className = 'campanha';
    const nome = document.createElement('strong');
    nome.textContent = c.titulo;
    const detalhe = document.createElement('span');
    detalhe.textContent = c.total_imagens + ' imagens';
    botao.append(nome, detalhe);
    botao.addEventListener('click', () => abrirCampanha(c));
    lista.appendChild(botao);
  });
} catch (err) {
  instrucao.textContent = 'Não foi possível carregar os dados das campanhas. Verifique os arquivos do projeto.';
  console.error(err);
}
</script>
</body>
</html>
